app = "ollalink-translate-relay"
primary_region = "iad"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "get"
  path = "/api/health"

[env]
  NODE_ENV = "production"
  MAX_PARTICIPANTS = "4"
  OLLALINK_WS_URL = "wss://sound-stream.ollalink.com/v1/speech/stream"
